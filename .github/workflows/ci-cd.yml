name: CI/CD — Lint, Tests, Build & Deploy

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scoring
          POSTGRES_PASSWORD: scoring
          POSTGRES_DB: scoring
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scoring"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      # Les tests de monitoring écrivent dans ce Postgres de service.
      DATABASE_URL: postgresql://scoring:scoring@localhost:5432/scoring
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Verify model artifacts are in sync with the bundle
        run: uv run python scripts/generate_model_artifacts.py --check

      - name: Run tests
        run: uv run pytest

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t scoring-api:ci .

  deploy:
    name: Deploy to Hugging Face Spaces
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"

      - name: Upload to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: lcamara/scoring-credit-pret-a-depenser
        run: uv run --no-project --with huggingface_hub python scripts/deploy_hf.py
