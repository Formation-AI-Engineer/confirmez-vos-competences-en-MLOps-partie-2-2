name: CI/CD — Lint, Tests, Build & Deploy

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Verify model artifacts are in sync with the bundle
        run: uv run python scripts/generate_model_artifacts.py --check

      - name: Run tests
        run: uv run pytest

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t scoring-api:ci .

  deploy:
    name: Deploy to Hugging Face Spaces
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: lcamara/scoring-credit-pret-a-depenser
        run: |
          remote="https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}"
          # HF rate-limite parfois le serveur git (HTTP 429) : on réessaie avec back-off.
          for attempt in 1 2 3 4 5; do
            if git push --force "$remote" HEAD:main; then
              echo "Déploiement réussi (tentative $attempt)."
              exit 0
            fi
            wait=$((attempt * 30))
            echo "Échec (tentative $attempt, probable 429). Nouvel essai dans ${wait}s..."
            sleep "$wait"
          done
          echo "Déploiement échoué après 5 tentatives." >&2
          exit 1
